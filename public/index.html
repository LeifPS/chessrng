<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0C1815">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Chess RNG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@600;800;900&family=Golos+Text:wght@400;500;600;700&family=Martian+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: dark;
  --bg:#0C1815; --bg-2:#11201C; --panel:#152722; --panel-2:#1B322B; --line:#264237; --line-2:#355A4B;
  --text:#EEE5CF; --muted:#9BB0A4; --faint:#6A8276;
  --brass:#D9A84B; --brass-hi:#F3CD7E; --brass-lo:#7E5F27;
  --red:#EC6A52; --ok:#86D9A0; --blue:#6FB6FF;
  --sq-l:#DCCBA4; --sq-d:#7C6147; --frame:#2B1F15;
  --f-disp:'Grenze Gotisch', 'Old English Text MT', Georgia, serif;
  --f-body:'Golos Text', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-mono:'Martian Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--bg)}
body{
  background:var(--bg);
  background-image:radial-gradient(ellipse 90% 60% at 50% -10%, #1C3B32 0%, transparent 65%);
  background-attachment:fixed;
  color:var(--text); font-family:var(--f-body); font-size:15px; line-height:1.45;
  padding-inline:16px; min-height:100vh;
}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brass-hi);outline-offset:2px}
h2,h3,h4{margin:0;font-weight:700;text-wrap:balance}
h3{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.note{color:var(--muted);font-size:13px;margin:0}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:14px 20px;flex-wrap:wrap;padding-block:16px 14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;line-height:1;user-select:none}
.brand .b1{font-family:var(--f-disp);font-weight:900;font-size:38px;color:var(--brass-hi);letter-spacing:.01em}
.brand .b2{font-family:var(--f-mono);font-weight:600;font-size:12px;color:var(--bg);background:var(--brass);padding:5px 6px 4px;border-radius:5px;transform:translateY(-6px) rotate(-6deg);box-shadow:0 2px 0 var(--brass-lo)}
.tabs{display:flex;gap:3px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.tab{border:0;background:none;padding:8px 14px;border-radius:7px;color:var(--muted);font-weight:600;cursor:pointer}
.tab:hover{color:var(--text)}
.tab[aria-selected="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--brass)}
.qbox{display:grid;gap:10px;justify-items:start;background:var(--bg-2);border:1px dashed var(--brass);border-radius:12px;padding:16px}
.qbox .qt{font-family:var(--f-mono);font-size:30px;font-weight:600;color:var(--brass-hi);line-height:1}
.rankgrid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:20px;align-items:start}
.rankbar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rtable{overflow-x:auto}
.rtable table{width:100%;border-collapse:collapse;font-size:14px}
.rtable th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
.rtable td{padding:8px;border-bottom:1px solid #ffffff08}
.rtable tr:nth-child(1) td:first-child{color:#F4C542;font-weight:700}.rtable tr:nth-child(2) td:first-child{color:#C9D3DB;font-weight:700}.rtable tr:nth-child(3) td:first-child{color:#D98C4E;font-weight:700}
.rtable tr.me td{background:color-mix(in srgb,var(--brass) 14%,transparent)}
@media (max-width:900px){.rankgrid{grid-template-columns:minmax(0,1fr)}}
.rollbadge{margin-left:auto;display:flex;align-items:center;gap:10px;background:var(--bg-2);border:1px solid var(--line);border-radius:10px;padding:6px 12px 6px 8px;cursor:pointer}
.rollbadge svg{width:34px;height:34px;transform:rotate(-90deg)}
.rollbadge .n{font-family:var(--f-mono);font-weight:600;font-size:18px;font-variant-numeric:tabular-nums}
.rollbadge .l{display:grid;line-height:1.15}
.rollbadge small{color:var(--muted);font-size:11px;font-family:var(--f-mono)}
main{max-width:1180px;margin:0 auto;padding-block:22px 60px}
section[hidden]{display:none}

/* ---------- common ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px;align-content:start}
.btn{font-weight:600;font-size:14px;padding:10px 16px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--text);cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn:hover:not(:disabled){border-color:var(--brass);}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#EABE62,#C88F37);color:#1E1507;border-color:#F3CD7E;box-shadow:0 3px 0 var(--brass-lo)}
.btn.primary:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 var(--brass-lo)}
.btn.big{font-size:17px;padding:14px 26px}
.btn.danger{border-color:#7a3a2e;color:#F2A594}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.test{border-style:dashed;border-color:var(--brass);color:var(--brass-hi);background:transparent}
.tog{display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;cursor:pointer;user-select:none}
.tog input{accent-color:var(--brass);width:16px;height:16px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;border:1px solid color-mix(in srgb,var(--rc) 60%,transparent);color:var(--rc);background:color-mix(in srgb,var(--rc) 12%,transparent);letter-spacing:.02em}
.rtxt{color:var(--rc)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel-2);border:1px solid var(--brass);color:var(--text);padding:10px 16px;border-radius:10px;z-index:90;font-size:14px;box-shadow:0 10px 30px #0009;max-width:calc(100% - 32px)}

/* ---------- piece model ---------- */
.pc{position:relative;display:block;width:100%;height:100%}
.pc>svg{position:relative;z-index:1;display:block;width:100%;height:100%;overflow:visible}
.pc::before,.pc::after{position:absolute;pointer-events:none;z-index:0}
.pc.sil>svg{filter:none!important}
.pc.sil::before,.pc.sil::after{content:none!important}
.pc.r3>svg{filter:drop-shadow(0 0 2px var(--rc))}
.pc.r4>svg{filter:drop-shadow(0 0 3px var(--rc))}
.pc.r4::before{content:'';inset:4%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 50%,transparent) 0%,transparent 66%);animation:pulse 2.6s ease-in-out infinite}
.pc.r5>svg{filter:drop-shadow(0 0 3px var(--rc)) drop-shadow(0 0 7px color-mix(in srgb,var(--rc) 60%,transparent))}
.pc.r5::before{content:'';inset:0;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 55%,transparent) 0%,transparent 64%);animation:pulse 1.5s ease-in-out infinite}
.pc.r6>svg{filter:drop-shadow(0 0 3px var(--rc))}
.pc.r6::before{content:'';inset:4%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 45%,transparent),transparent 65%)}
.pc.r6::after{content:'';inset:-2%;border-radius:50%;border:2px dashed color-mix(in srgb,var(--rc) 80%,transparent);animation:spin 14s linear infinite}
.pc.r7>svg{filter:drop-shadow(0 0 4px var(--rc))}
.pc.r7::before{content:'';inset:-4%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--rc) 55%,transparent),transparent 62%);animation:pulse 3s ease-in-out infinite}
.pc.r7::after{content:'';left:28%;right:28%;top:-9%;height:13%;border-radius:50%;border:2px solid var(--rc);box-shadow:0 0 8px var(--rc),inset 0 0 4px var(--rc);animation:float 2.4s ease-in-out infinite}
.pc.r8>svg{filter:drop-shadow(0 0 4px var(--rc)) drop-shadow(0 0 10px #fff6)}
.pc.r8::before{content:'';inset:-14%;border-radius:50%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--rc) 70%,transparent) 0deg 6deg,transparent 6deg 30deg);-webkit-mask:radial-gradient(circle,#000 20%,transparent 68%);mask:radial-gradient(circle,#000 20%,transparent 68%);animation:spin 16s linear infinite}
.pc.r9>svg{filter:drop-shadow(0 0 4px #9aa6ff)}
.pc.r9::before{content:'';inset:-8%;border-radius:50%;background:conic-gradient(from 0deg,#6C7CFF,#D46CFF,#46D1FF,#6CFFC8,#6C7CFF);filter:blur(7px);opacity:.6;animation:spin 7s linear infinite}
.pc.r9::after{content:'';inset:-6%;border-radius:50%;background:radial-gradient(circle at 20% 30%,#fff 0 1.2%,transparent 1.8%),radial-gradient(circle at 78% 22%,#fff 0 1%,transparent 1.6%),radial-gradient(circle at 70% 80%,#fff 0 1.3%,transparent 1.9%),radial-gradient(circle at 18% 75%,#fff 0 .9%,transparent 1.5%);animation:spin 9s linear infinite reverse}
.pc.r10>svg{animation:hue 5s linear infinite;filter:drop-shadow(0 0 5px #ff9cf0)}
.pc.r10::before{content:'';inset:-12%;border-radius:50%;background:conic-gradient(red,orange,yellow,lime,cyan,blue,magenta,red);filter:blur(9px);opacity:.55;animation:spin 4s linear infinite}
.pc.r10::after{content:'';inset:-4%;border-radius:50%;border:2px solid transparent;border-top-color:#fff;border-bottom-color:#fff;animation:spin 2.2s linear infinite}
.pc.r11>svg{animation:glitch 2.8s steps(1) infinite}
.pc.r11::before{content:'';inset:-10%;border-radius:50%;background:repeating-conic-gradient(#fff 0 15deg,#000 15deg 30deg);opacity:.35;-webkit-mask:radial-gradient(circle,transparent 30%,#000 45%,transparent 70%);mask:radial-gradient(circle,transparent 30%,#000 45%,transparent 70%);animation:spin 3s linear infinite}
.pc.r11::after{content:'';inset:-4%;border-radius:50%;border:2px solid #fff;mix-blend-mode:difference;animation:spin 1.6s linear infinite reverse, pulse 1.2s ease-in-out infinite}
.pc.r12>svg{animation:bang 3.2s ease-in-out infinite}
.pc.r12::before{content:'';inset:-18%;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 9%,#FFD9A0aa 10%,transparent 13%);animation:shock 1.8s linear infinite}
.pc.r12::after{content:'';inset:-6%;border-radius:50%;background:conic-gradient(from 0deg,#fff,#FFC46B,#FF6A2B,#1a0800,#FFC46B,#fff);-webkit-mask:radial-gradient(circle,transparent 52%,#000 56%,#000 62%,transparent 66%);mask:radial-gradient(circle,transparent 52%,#000 56%,#000 62%,transparent 66%);animation:spin 2.4s linear infinite;filter:drop-shadow(0 0 6px #FFC46B)}
@keyframes bang{0%,100%{filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px #FFB347)}50%{filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 22px #FF7A2B) brightness(1.15)}}
@keyframes shock{from{transform:scale(.55);opacity:1}to{transform:scale(1.25);opacity:0}}
#hype.r12{animation:hypein .35s ease-out,whiteout 1.2s ease-out}
@keyframes whiteout{0%{background-color:#fff}100%{background-color:transparent}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.94)}50%{opacity:1;transform:scale(1.04)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes hue{to{filter:hue-rotate(360deg) drop-shadow(0 0 5px #ff9cf0)}}
@keyframes glitch{0%{transform:none;filter:none}8%{transform:translate(2px,-1px);filter:invert(1)}10%{transform:translate(-2px,1px);filter:none}46%{transform:none}48%{transform:translate(-1px,0) skewX(8deg);filter:invert(1) drop-shadow(3px 0 #f0f) drop-shadow(-3px 0 #0ff)}51%{transform:none;filter:drop-shadow(2px 0 #f0f) drop-shadow(-2px 0 #0ff)}80%{filter:none}}

/* ---------- roll tab ---------- */
.rollgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.rollmain{display:grid;gap:14px}
.stage{position:relative;min-height:430px;border-radius:16px;border:1px solid var(--line);overflow:hidden;display:grid;place-items:center;padding:24px;
  background:radial-gradient(circle at 50% 42%,color-mix(in srgb,var(--rc,#2b5446) 22%,#1A332C) 0%,#0E1B18 72%)}
.stage::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(45deg,transparent 0 22px,#ffffff05 22px 23px);pointer-events:none}
.idle{text-align:center;display:grid;gap:10px;justify-items:center;position:relative}
.idle .big{font-family:var(--f-disp);font-size:52px;font-weight:800;color:var(--brass-hi);line-height:1}
.reel{text-align:center;position:relative;display:grid;gap:6px}
.reelname{font-family:var(--f-disp);font-weight:900;font-size:clamp(44px,8vw,76px);line-height:1;color:var(--rc);text-shadow:0 0 24px color-mix(in srgb,var(--rc) 60%,transparent)}
.reelodds{font-family:var(--f-mono);color:var(--muted);font-size:14px}
.reveal{position:relative;display:grid;justify-items:center;gap:6px;text-align:center;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
.reveal .model{width:190px;height:190px;margin-bottom:6px}
.reveal .rname{font-family:var(--f-disp);font-weight:800;font-size:44px;line-height:1.05}
.reveal .rmeta{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.reveal .rdesc{max-width:46ch;color:var(--muted);font-size:14px}
.newb{font-family:var(--f-mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;background:var(--brass);color:#1E1507;padding:4px 8px;border-radius:5px}
.burst{position:absolute;left:50%;top:95px;width:10px;height:10px;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 0 var(--rc);animation:burst .8s ease-out forwards;pointer-events:none}
@keyframes burst{to{box-shadow:0 0 0 180px transparent;background:transparent}}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.multi{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;width:100%;max-width:620px}
.mcard{display:grid;justify-items:center;gap:4px;padding:10px 6px;border-radius:10px;border:1px solid color-mix(in srgb,var(--rc) 45%,var(--line));background:color-mix(in srgb,var(--rc) 10%,#0E1B18);cursor:pointer;animation:pop .4s both}
.mcard{position:relative}.mcard .m{width:64px;height:64px}
.mcard .mn{position:absolute;top:6px;right:6px;font-family:var(--f-mono);font-size:11px;font-weight:600;background:#000a;padding:1px 5px;border-radius:4px}
.multi.many{grid-template-columns:repeat(6,minmax(0,1fr));max-height:520px;overflow:auto;padding:4px}
.multi.many .m{width:52px;height:52px}
.msum{grid-column:1/-1;font-family:var(--f-mono);font-size:13px;color:var(--muted);text-align:center}
.mcard b{font-size:12px;line-height:1.2;text-align:center}
.mcard small{font-size:10px;color:var(--rc);font-family:var(--f-mono)}
.rollbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.hist{display:flex;flex-wrap:wrap;gap:6px}
.hchip{width:42px;height:42px;padding:3px;border-radius:8px;border:1px solid color-mix(in srgb,var(--rc) 50%,var(--line));background:color-mix(in srgb,var(--rc) 10%,var(--bg-2));cursor:pointer}
.odds{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.odds li{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:7px 4px;border-bottom:1px solid #ffffff08;font-size:14px}
.odds .sw{width:12px;height:12px;border-radius:3px;background:var(--rc);box-shadow:0 0 8px color-mix(in srgb,var(--rc) 60%,transparent)}
.odds .o{font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.odds .c{font-family:var(--f-mono);font-size:12px;color:var(--faint);min-width:42px;text-align:right}
.odds li.got .c{color:var(--text)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:10px}
.stat b{display:block;font-family:var(--f-mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
details.settings summary{cursor:pointer;color:var(--muted);font-size:13px}
details.settings .inner{display:grid;gap:10px;padding-top:10px}
#hype{position:fixed;inset:0;z-index:80;display:grid;place-items:center;text-align:center;cursor:pointer;
  background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--rc) 45%,transparent) 0%,#000000e0 62%);animation:hypein .35s ease-out}
#hype .ht{font-family:var(--f-disp);font-weight:900;font-size:clamp(56px,13vw,140px);color:var(--rc);line-height:.95;text-shadow:0 0 40px var(--rc),0 0 2px #000;animation:pop .6s cubic-bezier(.2,1.5,.4,1)}
#hype .ho{font-family:var(--f-mono);font-size:clamp(16px,3vw,22px);color:#fff;margin-top:10px}
#hype .hm{width:150px;height:150px;margin:18px auto 0}
#hype .hn{font-size:20px;font-weight:700;margin-top:6px}
@keyframes hypein{from{opacity:0}to{opacity:1}}

/* ---------- collection ---------- */
.chead{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:baseline;margin-bottom:18px}
.chead h2{font-family:var(--f-disp);font-size:40px;font-weight:800;color:var(--brass-hi);line-height:1}
.rgroup{margin-bottom:26px}
.rgh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid color-mix(in srgb,var(--rc) 35%,var(--line))}
.rgh h3{font-family:var(--f-disp);font-size:26px;letter-spacing:0;text-transform:none;color:var(--rc);font-weight:800}
.rgh span{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}
.card{position:relative;display:grid;justify-items:center;gap:6px;padding:12px 8px 10px;border-radius:12px;cursor:pointer;text-align:center;
  border:1px solid color-mix(in srgb,var(--rc) 32%,var(--line));
  background:radial-gradient(circle at 50% 32%,color-mix(in srgb,var(--rc) 16%,transparent),transparent 70%),var(--panel)}
.card:hover{border-color:var(--rc)}
.card .m{width:80px;height:80px}
.card b{font-size:13px;line-height:1.2}
.card small{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.card .cnt{position:absolute;top:8px;right:8px;font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--text);background:#0008;padding:2px 6px;border-radius:5px}
.card.unk b{color:var(--faint)}

/* modal */
.modal{position:fixed;inset:0;z-index:70;background:#040907d0;display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{position:relative;width:100%;max-width:800px;max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid color-mix(in srgb,var(--rc) 45%,var(--line-2));border-radius:16px;padding:22px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px}
.sheet .x{position:absolute;top:10px;right:10px;width:34px;height:34px;border-radius:8px;border:1px solid var(--line-2);background:var(--bg-2);cursor:pointer;font-size:18px;line-height:1}
.dleft{display:grid;gap:10px;justify-items:center;align-content:start;text-align:center}
.dleft .m{width:190px;height:190px;border-radius:14px;background:radial-gradient(circle at 50% 45%,color-mix(in srgb,var(--rc) 22%,transparent),transparent 70%)}
.dname{font-family:var(--f-disp);font-weight:800;font-size:40px;line-height:1;padding-right:36px}
.ddesc{color:var(--text);max-width:60ch;margin:0}
.dright{display:grid;gap:14px;align-content:start}
.sidesel{display:flex;gap:4px}
.diagwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.diag{display:grid;grid-template-columns:repeat(8,1fr);width:224px;max-width:100%;aspect-ratio:1;border:3px solid var(--frame);border-radius:4px}
.diag i{position:relative;display:block}
.diag i.l{background:var(--sq-l)} .diag i.d{background:var(--sq-d)}
.diag i.me{background:color-mix(in srgb,var(--brass) 60%,var(--sq-l))}
.diag i.me .pc{position:absolute;inset:6%;width:88%;height:88%}
.diag i::after{content:none;position:absolute;inset:0;margin:auto}
.diag i.m::after{content:'';width:34%;height:34%;border-radius:50%;background:#2C8A4E}
.diag i.b::after{content:'';width:40%;height:40%;border-radius:3px;background:#1F5FA8;transform:rotate(45deg)}
.diag i.c::after{content:'';width:62%;height:62%;border-radius:50%;border:3px solid #C23A22}
.diag i.s::after{content:'';width:56%;height:56%;background:radial-gradient(circle,#B8321F 0 18%,transparent 20%),linear-gradient(#B8321F,#B8321F) center/100% 2px no-repeat,linear-gradient(#B8321F,#B8321F) center/2px 100% no-repeat;border-radius:50%;border:2px solid #B8321F}
.legend{display:grid;gap:6px;font-size:13px;color:var(--muted)}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:14px;height:14px;display:inline-block;border-radius:50%}
.traits{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.traits li{display:grid;gap:2px;padding:10px 12px;border-radius:9px;background:var(--bg-2);border:1px solid var(--line)}
.traits li b{font-size:14px;display:flex;gap:8px;align-items:center}
.traits li span{font-size:13px;color:var(--muted)}
.tag{font-family:var(--f-mono);font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#1E1507;background:var(--brass);padding:1px 5px;border-radius:3px}

/* ---------- loadout ---------- */
.lgrid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:start}
.lmain{display:grid;gap:14px}
.ltabs{display:flex;gap:6px;flex-wrap:wrap}
.ltab{padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg-2);color:var(--muted);cursor:pointer;font-weight:600;font-size:14px;display:grid;text-align:left;gap:1px}
.ltab small{font-family:var(--f-mono);font-size:11px;font-weight:400}
.ltab[aria-selected="true"]{border-color:var(--brass);color:var(--text);background:var(--panel-2)}
.lname{display:flex;gap:10px;align-items:center}
.lname label{font-size:13px;color:var(--muted)}
input[type=text],select{background:var(--bg-2);border:1px solid var(--line-2);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit;font-size:14px;min-width:0}
.lname input{flex:1;max-width:280px}
.lboard{display:grid;grid-template-columns:22px repeat(8,minmax(0,1fr));gap:0;max-width:640px}
.lboard .rk,.lboard .fl{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:grid;place-items:center}
.lboard .fl{padding-top:4px}
.slot{position:relative;aspect-ratio:1;border:0;padding:6%;cursor:pointer}
.slot.l{background:var(--sq-l)} .slot.d{background:var(--sq-d)}
.slot:hover{box-shadow:inset 0 0 0 3px var(--brass-hi)}
.slot.over{box-shadow:inset 0 0 0 3px var(--ok)}
.slot.kg::after{content:'König';position:absolute;left:3px;bottom:2px;font-family:var(--f-mono);font-size:8px;letter-spacing:.06em;color:#1E1507;background:var(--brass-hi);padding:0 3px;border-radius:2px;z-index:3}
.lframe{border:6px solid var(--frame);border-radius:6px;box-shadow:0 12px 30px #0007}
.lstatus{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.lstatus .ok{color:var(--ok);font-weight:600}
.lstatus .bad{color:var(--red);font-weight:600}
.hand{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--bg-2);border:1px dashed var(--brass);border-radius:10px;padding:8px 12px;font-size:14px}
.hand .m{width:40px;height:40px}
.lbtns{display:flex;gap:8px;flex-wrap:wrap}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;max-height:620px;overflow:auto;padding-right:4px}
.pcard{display:grid;justify-items:center;gap:3px;padding:8px 4px;border-radius:10px;cursor:pointer;text-align:center;border:1px solid color-mix(in srgb,var(--rc) 30%,var(--line));background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc) 14%,transparent),transparent 70%),var(--bg-2)}
.pcard .m{width:56px;height:56px}
.pcard b{font-size:12px;line-height:1.15}
.pcard small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.pcard.sel{border-color:var(--brass-hi);box-shadow:0 0 0 2px var(--brass)}
.pcard.none{opacity:.4}

/* ---------- play ---------- */
.setupgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.setup h2{font-family:var(--f-disp);font-size:40px;font-weight:800;color:var(--brass-hi);line-height:1}
.field{display:grid;gap:6px}
.field>.lbl{font-size:13px;color:var(--muted);font-weight:600}
.seg{display:flex;flex-wrap:wrap;gap:3px;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;padding:3px;width:fit-content;max-width:100%}
.seg button{border:0;background:none;padding:7px 12px;border-radius:6px;color:var(--muted);cursor:pointer;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--panel-2);color:var(--text);box-shadow:inset 0 -2px 0 var(--brass)}
.hint{font-size:13px;color:var(--muted);margin:0}
.warn{font-size:13px;color:var(--red);margin:0}
.mini{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));max-width:360px;border:4px solid var(--frame);border-radius:4px}
.mini i{aspect-ratio:1;display:block;padding:5%}
.mini i.l{background:var(--sq-l)} .mini i.d{background:var(--sq-d)}
.prevs{display:grid;gap:16px}
.prev{display:grid;gap:6px}
.prev .ph{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted)}
.soon{border:1px dashed var(--line-2);border-radius:10px;padding:10px 12px;color:var(--muted);font-size:13px}

.game{display:grid;grid-template-columns:minmax(0,640px) minmax(0,1fr);gap:24px;align-items:start}
.boardwrap{padding:12px}
.board{position:relative;width:100%;aspect-ratio:1;border-radius:3px;box-shadow:0 0 0 12px var(--frame),0 0 0 13px #4A3625,0 24px 60px #000a;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.sqs{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(8,1fr)}
.sq{position:relative;border:0;padding:0;cursor:pointer;display:block}
.sq.l{background:var(--sq-l)} .sq.d{background:var(--sq-d)}
.sq .co{position:absolute;font-family:var(--f-mono);font-size:10px;font-weight:600;pointer-events:none;opacity:.75}
.sq.l .co{color:var(--sq-d)} .sq.d .co{color:var(--sq-l)}
.sq .co.f{right:3px;bottom:1px} .sq .co.r{left:3px;top:2px}
.sq.last{box-shadow:inset 0 0 0 999px #F2C85A40}
.sq.sel{box-shadow:inset 0 0 0 999px #F2C85A80}
.sq.chk{background-image:radial-gradient(circle,#FF3B2Fcc 0%,#FF3B2F55 45%,transparent 72%)}
.sq::after{content:none;position:absolute;inset:0;margin:auto;pointer-events:none;z-index:4}
.sq.mv::after{content:'';width:30%;height:30%;border-radius:50%;background:#1D2A22a0}
.sq.cp::after{content:'';inset:4%;border-radius:50%;border:5px solid #B3261Eb8}
.sq.sh::after{content:'';width:70%;height:70%;border-radius:50%;border:3px solid #1E6FD0;background:linear-gradient(#1E6FD0,#1E6FD0) center/100% 3px no-repeat,linear-gradient(#1E6FD0,#1E6FD0) center/3px 100% no-repeat}
.sq.sw::after{content:'';width:62%;height:62%;border-radius:50%;border:3px dashed #2E8B57}
.sq.cs::after{content:'';width:34%;height:34%;border-radius:4px;background:#2B6CB0c0;transform:rotate(45deg)}
.sq.hov{box-shadow:inset 0 0 0 3px #ffffff90}
.pcs,.fxl{position:absolute;inset:0;pointer-events:none}
.bp{position:absolute;left:0;top:0;width:12.5%;height:12.5%;padding:0;transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .3s;z-index:2}
.bp>.pc{position:absolute;inset:7%;width:auto;height:auto}
.bp.gone{opacity:0;transform-origin:center}
.bp.frz .pc>svg{filter:saturate(.3) brightness(1.1) drop-shadow(0 0 3px #8fd8ff)!important}
.bp .bdg{position:absolute;z-index:3;font-family:var(--f-mono);font-size:9px;font-weight:600;line-height:1;padding:2px 3px;border-radius:3px}
.bp .bdg.sh{top:3%;right:3%;width:22%;height:24%;padding:0;background:none}
.bp .bdg.lv{bottom:3%;right:3%;background:#E2574C;color:#fff}
.bp .bdg.kg{top:3%;left:3%;width:20%;height:20%;padding:0}
.fx{position:absolute;width:12.5%;height:12.5%;left:0;top:0;pointer-events:none;z-index:5;display:grid;place-items:center}
.fx.boom::before{content:'';width:20%;height:20%;border-radius:50%;background:radial-gradient(circle,#fff 0,#FFD166 30%,#EF5B2A 60%,transparent 70%);animation:boom .6s ease-out forwards}
@keyframes boom{to{width:320%;height:320%;opacity:0}}
.fx.shield::before{content:'';width:90%;height:90%;border-radius:50%;border:4px solid #7CC8FF;box-shadow:0 0 16px #7CC8FF;animation:shieldfx .6s ease-out forwards}
@keyframes shieldfx{from{transform:scale(.6);opacity:1}to{transform:scale(1.3);opacity:0}}
.fx.conv::before{content:'';width:90%;height:90%;border-radius:50%;background:conic-gradient(#C77DFF,transparent,#C77DFF);animation:spin .6s linear, fadeout .7s forwards}
.fx.reborn::before{content:'';width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#FFB347cc,transparent 70%);animation:shieldfx .8s ease-out forwards}
.fx.promo::before{content:'';width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,#F3CD7Ecc,transparent 70%);animation:shieldfx .8s ease-out forwards}
@keyframes fadeout{to{opacity:0}}
.beam{position:absolute;height:4px;left:0;top:0;transform-origin:0 50%;background:linear-gradient(90deg,#fff,#6FB6FF);box-shadow:0 0 10px #6FB6FF;border-radius:2px;z-index:5;animation:fadeout .45s ease-in forwards}
.endcard{position:absolute;inset:0;display:grid;place-items:center;z-index:8;background:#07100dcc;border-radius:3px;animation:hypein .4s}
.endcard .in{display:grid;gap:10px;justify-items:center;text-align:center;padding:20px}
.endcard .t{font-family:var(--f-disp);font-weight:900;font-size:clamp(40px,8vw,64px);color:var(--brass-hi);line-height:1}
.endcard .w{color:var(--muted)}
.side{display:grid;gap:12px;align-content:start}
.status{display:grid;gap:4px}
.turn{display:flex;align-items:center;gap:10px;font-size:18px;font-weight:700}
.turn .dot{width:18px;height:18px;border-radius:50%;border:2px solid #000}
.turn .dot.w{background:#F4EEDF} .turn .dot.b{background:#2A2622;border-color:#8a7e70}
.chkmsg{color:var(--red);font-weight:600;font-size:14px}
.think{color:var(--muted);font-size:14px;display:flex;align-items:center;gap:8px}
.think::before{content:'';width:12px;height:12px;border-radius:50%;border:2px solid var(--brass);border-right-color:transparent;animation:spin .8s linear infinite}
.info{min-height:130px}
.ihead{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.ihead .m{width:64px;height:64px}
.ihead b{font-size:17px;display:block}
.ichips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:11px;font-weight:600;padding:3px 7px;border-radius:5px;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text)}
.chip.rule{border-color:var(--brass);color:var(--brass-hi)}
.chip.st{border-color:#3d6d8f;color:#9fd2ff}
.caps{display:grid;gap:6px}
.caprow{display:flex;flex-wrap:wrap;gap:2px;min-height:26px;align-items:center}
.caprow .m{width:26px;height:26px}
.caprow small{color:var(--faint);font-size:12px}
.log{margin:0;padding:0 0 0 0;list-style:none;max-height:240px;overflow:auto;display:grid;gap:3px;font-size:13px}
.log li{display:grid;grid-template-columns:34px 1fr;gap:6px;padding:3px 0;border-bottom:1px solid #ffffff08}
.log li .n{font-family:var(--f-mono);font-size:11px;color:var(--faint);padding-top:2px}
.log li em{display:block;font-style:normal;color:var(--brass-hi);font-size:12px}
.gbtns{display:flex;gap:8px;flex-wrap:wrap}
.choice .row{display:flex;gap:8px;flex-wrap:wrap}

@media (max-width:900px){
  .rollgrid,.lgrid,.setupgrid,.game{grid-template-columns:minmax(0,1fr)}
  .sheet{grid-template-columns:minmax(0,1fr)}
  .rollbadge{margin-left:0}
}
@media (max-width:560px){
  .brand .b1{font-size:32px}
  .tabs{flex-wrap:nowrap;width:100%}
  .tab{flex:1;padding:8px 2px;font-size:13px}
  .stage{min-height:360px;padding:16px}
  .multi{grid-template-columns:repeat(3,minmax(0,1fr))}
  .multi.many{grid-template-columns:repeat(4,minmax(0,1fr))}
  .reveal .model{width:150px;height:150px}
  .reveal .rname{font-size:36px}
  .boardwrap{padding:10px}
  .board{box-shadow:0 0 0 8px var(--frame),0 0 0 9px #4A3625,0 18px 40px #000a}
  .dname{font-size:32px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

<script src="https://canopybase.pages.dev/sdk/canopy-sdk.js"></script>
<script>
"use strict";
/* ================= DATA ================= */
const RAR=[
  {n:'Gewöhnlich',c:'#A7B2AA',odds:1},
  {n:'Ungewöhnlich',c:'#6ED08A',odds:3},
  {n:'Selten',c:'#52A8F5',odds:6},
  {n:'Episch',c:'#B77DF4',odds:16},
  {n:'Legendär',c:'#F4B73A',odds:45},
  {n:'Mythisch',c:'#FF5A84',odds:140},
  {n:'Uralt',c:'#E8843F',odds:450},
  {n:'Himmlisch',c:'#8AEAF2',odds:1500},
  {n:'Göttlich',c:'#FFE9A0',odds:5000},
  {n:'Kosmisch',c:'#8C98FF',odds:20000},
  {n:'Unendlich',c:'#FF9CF0',odds:80000},
  {n:'Paradox',c:'#F4F4F4',odds:350000},
  {n:'Urknall',c:'#FFC46B',odds:2000000},
];
// effektive Wahrscheinlichkeit (Würfel prüft von der seltensten Stufe abwärts)
const PEFF=(()=>{const p=[];let rest=1;for(let i=RAR.length-1;i>=1;i--){p[i]=rest/RAR[i].odds;rest*=1-1/RAR[i].odds}p[0]=rest;return p})();

const ORTH=[[1,0],[-1,0],[0,1],[0,-1]], DIAG=[[1,1],[1,-1],[-1,1],[-1,-1]], ALL=ORTH.concat(DIAG);
function sym(a,b){const r=[],k=new Set();for(const[p,q]of[[a,b],[b,a]])for(const sx of[1,-1])for(const sy of[1,-1]){const v=[p*sx,q*sy];if(!k.has(v+'')){k.add(v+'');r.push(v)}}return r}
function rad(n){const r=[];for(let dx=-n;dx<=n;dx++)for(let dy=-n;dy<=n;dy++)if(dx||dy)r.push([dx,dy]);return r}
const KN=sym(1,2), CAMEL=sym(1,3), ZEBRA=sym(2,3);
const Lp=(o,mode='mc')=>({ty:'L',o,mode});
const Rd=(o,n=8,mode='mc',x={})=>({ty:'R',o,n,mode,...x});
const Cn=(o)=>({ty:'C',o,mode:'mc'});
const Sh=(o,n=8)=>({ty:'S',o,n,mode:'c'});
const Tp=()=>({ty:'T',o:[],mode:'m'});
const Gh=(o)=>({ty:'G',o,mode:'mc'});
const Sw=(o,any)=>({ty:'W',o:o||[],any:!!any,mode:'m'});
const DAB=sym(2,0), ALF=sym(2,2);
const PAWN=[Lp([[0,1]],'m'),Rd([[0,1]],2,'m',{first:1}),Lp([[1,1],[-1,1]],'c')];

const TRAITS={
  king:{n:'König',d:()=>'Wird diese Figur geschlagen, ist die Partie verloren. Jedes Loadout braucht genau eine.'},
  promote:{n:'Beförderung',d:D=>`Erreicht sie die gegnerische Grundreihe, wird sie zur ${DEFN(D.pt||'dame')}.`},
  ep:{n:'En passant',d:()=>'Zieht sie zwei Felder vor, darf ein Gegner sie im Vorbeigehen schlagen. Sie selbst darf das auch.'},
  castle:{n:'Rochade',d:D=>D.t.includes('king')?'Darf mit einem unbewegten Rochade-Partner rochieren: zwei Felder zur Seite, der Partner springt vorbei.':'Kann Rochade-Partner eines unbewegten Königs sein.'},
  shield:{n:'Schild',d:()=>'Der erste Angriff zerbricht nur den Schild. Der Angreifer bleibt stehen. Schützt auch vor Explosionen.'},
  explode:{n:'Explosiv',d:()=>'Wird sie geschlagen, explodiert sie und zerstört alle Figuren auf den 8 Nachbarfeldern, auch den Angreifer.'},
  freeze:{n:'Frostaura',d:()=>'Gegnerische Figuren auf den 8 Nachbarfeldern können nicht ziehen.'},
  noble:{n:'Adel',d:()=>'Kann nur von Figuren gleicher oder höherer Seltenheit geschlagen werden.'},
  rebirth:{n:'Wiedergeburt',d:D=>`Wird sie geschlagen, erscheint sie auf ihrem Startfeld neu (${D.lives}× pro Partie). Ist es besetzt, auf der eigenen Grundreihe.`},
  hydra:{n:'Teilung',d:D=>{const sp=D.spawn||{id:'bauer',n:2};return`Wird sie geschlagen, erscheinen ${sp.n}× ${DEFN(sp.id)} auf freien Nachbarfeldern.`}},
  regen:{n:'Regeneration',d:()=>'Ein zerbrochener Schild wächst nach drei eigenen Zügen wieder nach.'},
  drain:{n:'Blutdurst',d:()=>'Schlägt sie eine Figur, bekommt sie einen Schild, falls sie keinen hat.'},
  summon:{n:'Beschwörung',d:()=>'Schlägt sie eine Figur, erhebt sich dort ein eigenes Skelett.'},
  bless:{n:'Segen',d:()=>'Nach jedem ihrer Züge bekommen eigene Figuren bis Selten auf den Nachbarfeldern einen Schild.'},
  banner:{n:'Banner',d:D=>`Eigene Figuren auf den Nachbarfeldern können nur von Figuren ab ${RAR[D.r].n} geschlagen werden.`},
  heir:{n:'Thronfolger',d:()=>'Fällt dein König, wird diese Figur zum neuen König, und die Partie geht weiter.'},
  mimic:{n:'Nachahmung',d:()=>'Zieht zusätzlich wie jede Figur, die gerade direkt neben ihr steht, egal welcher Farbe.'},
  ethereal:{n:'Ätherisch',d:()=>'Kann nur durch Schüsse, Explosionen oder Königsfiguren getroffen werden.'},
  grav:{n:'Schwerkraft',rule:1,d:()=>'Solange sie lebt, können gegnerische Figuren nicht rückwärts ziehen.'},
  crown:{n:'Krönung',rule:1,d:()=>'Solange sie lebt, werden deine Figuren bei der Beförderung zur Amazone statt zur Dame.'},
  convert:{n:'Seelenfang',d:()=>'Schlägt nicht, sondern bekehrt: Die Zielfigur wechselt die Seite. Könige werden normal geschlagen.'},
  rache:{n:'Rache',d:()=>'Die Figur, die sie schlägt, wird mit zerstört.'},
  evolve:{n:'Aufstieg',d:D=>`Nach ${D.evo.n} geschlagenen Figuren steigt sie zu ${DEFN(D.evo.to)} auf.`},
  storm:{n:'Sturm',rule:1,d:()=>'Solange sie lebt, ziehen gegnerische Langschrittler höchstens 3 Felder weit.'},
  wrap:{n:'Weltenrand',rule:1,d:()=>'Solange sie lebt, dürfen alle deine Figuren über den linken und rechten Brettrand ziehen.'},
  guard:{n:'Königswache',rule:1,d:()=>'Solange sie lebt, kann dein König nur von Figuren ab Episch geschlagen werden.'},
};

const CAT=[
 // Gewöhnlich
 {id:'bauer',n:'Bauer',r:0,sh:'pawn',moves:PAWN,t:['promote','ep'],v:1,d:'Zieht ein Feld vor, beim ersten Zug auch zwei. Schlägt schräg nach vorn.'},

const DEF={}; CAT.forEach(D=>{D.T={};D.t.forEach(t=>D.T[t]=1);DEF[D.id]=D});
DEF._d={id:'_d',n:'?',r:0,moves:[],t:[],T:{},v:0};
function DEFN(id){return DEF[id]?DEF[id].n:id}
const BYR=RAR.map((_,i)=>CAT.filter(D=>D.r===i));
// Eigene Chance pro Figur: leicht gestreut um den Wert der Stufe, stärkere Figuren etwas seltener
function niceOdds(x){if(x<10)return Math.round(x*10)/10;const m=Math.pow(10,Math.floor(Math.log10(x))-1);return Math.round(x/m)*m}
// Die Chance der Stufe bleibt gleich; innerhalb der Stufe bekommt jede Figur ein eigenes Gewicht (stärkere etwas seltener).
BYR.forEach((list,r)=>{const sorted=list.map((D,i)=>[D,i]).sort((a,b)=>a[0].v-b[0].v||a[1]-b[1]);const n=sorted.length;

Object.assign(SHAPES,UNIQ);
function pieceSVG(id,side){
  const D=DEF[id];const uniq=!!UNIQ[id];const S=SHAPES[id]||SHAPES[D.sh]||SHAPES.pawn;const r=D.r;const sil=side==='sil',blk=side==='b';
  const fill=sil?'#0A1411':`url(#g${side}${r})`;
  const rc=RAR[r].c;
  const dark=sil?'#2F4A40':blk?'#050404':'#1E1914';
  const inner=blk?(r<2?'#7E7468':mix('#7E7468',rc,.3)):dark;
  const ec=sil?'#1c2c27':(r===0?'#7C847D':rc);
  const detail=sil?'#1c2c27':blk?inner:dark;
  const P=x=>typeof x==='string'?{d:x}:x;
  const T=x=>x.t?` transform="${x.t}"`:'';
  const V=' vector-effect="non-scaling-stroke"';
  const body=[BASE,...S.p].map(P);
  let s=`<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke-linejoin="round" stroke-linecap="round" fill-rule="evenodd">`;
  if(S.pre&&!sil)for(const x of S.pre.map(P))s+=`<path d="${x.d}"${T(x)} fill="${ec}" fill-opacity=".9" stroke="${dark}" stroke-width="1.5"${V}/>`;
  if(blk)for(const x of body)s+=`<path d="${x.d}"${T(x)} fill="${dark}" stroke="${dark}" stroke-width="5.6"${V}/>`;
  for(const x of body)s+=`<path d="${x.d}"${T(x)} fill="${sil?fill:(x.f||fill)}" stroke="${blk?inner:dark}" stroke-width="${blk?1.5:2.6}"${V}/>`;
  if(!sil){
    if(S.f)for(const x of S.f.map(P))s+=`<path d="${x.d}"${T(x)} fill="${x.f}" stroke="${dark}" stroke-width="1.3"${V}/>`;
    if(S.c)for(const x of S.c.map(P))s+=`<path d="${x.d}"${T(x)} fill="${ec}" stroke="${dark}" stroke-width="1.3"${V}/>`;
  }
  if(S.l)for(const x of S.l.map(P))s+=`<path d="${x.d}"${T(x)} fill="none" stroke="${detail}" stroke-width="2.2"${V}/>`;
  if(S.k)for(const x of S.k.map(P))s+=`<path d="${x.d}"${T(x)} fill="${detail}" stroke="none"/>`;
  if(S.eye)for(const[x,y,rr]of S.eye)s+=`<circle cx="${x}" cy="${y}" r="${rr}" fill="${detail}"/>`;
  s+='</g>';
  if(D.em&&!uniq&&!sil){const E=EMB[D.em],[ex,ey,es]=S.e;
    s+=`<g transform="translate(${ex} ${ey}) scale(${es})">`;
    if(E.f)s+=`<path d="${E.f}" fill="${ec}" stroke="${dark}" stroke-width="1.4"${V}/>`;
    if(E.s)s+=`<path d="${E.s}" fill="none" stroke="${ec}" stroke-width=".32" stroke-linecap="round"/>`;
    if(E.pupil)s+=`<circle r=".32" fill="${dark}"/>`;
    s+='</g>';}
  else if(r>=4&&!sil&&S.e){const[ex,ey]=S.e;s+=`<circle cx="${ex}" cy="${ey}" r="${uniq?3.2:4}" fill="${ec}" stroke="${dark}" stroke-width="1.4"/><circle cx="${ex-1}" cy="${ey-1}" r="1" fill="#fff" opacity=".8"/>`}
  s+='</svg>';
  return `<span class="pc ${sil?'sil':'r'+r}">${s}</span>`;
}

/* ================= ENGINE ================= */
const sqn=i=>'abcdefgh'[i&7]+((i>>3)+1);
function mk(s,id,o,sq){const D=DEF[id];return{d:id,o,m:0,sh:D.T.shield?1:0,k:0,lv:D.lives||0,h:sq,u:s.uid++}}
function newState(){return{b:Array(64).fill(null),turn:0,ep:null,half:0,ply:0,end:null,cap:[[],[]],uid:1,log:[],ev:[]}}
function clone(s){return{b:s.b.map(p=>p?{...p}:null),turn:s.turn,ep:s.ep,half:s.half,ply:s.ply,end:s.end,cap:[s.cap[0].slice(),s.cap[1].slice()],uid:s.uid,log:null,ev:[]}}
const isKing=p=>!!(p.kg||DEF[p.d].T.king);
function rules(s){const r={wrap:[0,0],storm:[0,0],guard:[0,0],grav:[0,0],crown:[0,0],banner:[0,0]};for(const p of s.b){if(!p)continue;const T=DEF[p.d].T;if(T.wrap)r.wrap[p.o]=1;if(T.storm)r.storm[p.o]=1;if(T.guard)r.guard[p.o]=1;if(T.grav)r.grav[p.o]=1;if(T.crown)r.crown[p.o]=1;if(T.banner)r.banner[p.o]=1}return r}
function nbrs(sq){const x=sq&7,y=sq>>3,o=[];for(const[dx,dy]of ALL){const nx=x+dx,ny=y+dy;if(nx>=0&&nx<8&&ny>=0&&ny<8)o.push(ny*8+nx)}return o}
function frozen(s,sq,o){for(const n of nbrs(sq)){const p=s.b[n];if(p&&p.o!==o&&DEF[p.d].T.freeze)return true}return false}
function capOK(s,A,T,tsq,R,kind){const AD=DEF[A.d],TD=DEF[T.d];
  if(TD.T.noble&&AD.r<TD.r)return false;
  if(isKing(T)&&R.guard[T.o]&&AD.r<3)return false;
  if(TD.T.ethereal&&kind!=='sh'&&!isKing(A))return false;
  if(R.banner[T.o]){for(const n of nbrs(tsq)){const B=s.b[n];if(B&&B!==T&&B.o===T.o&&DEF[B.d].T.banner&&AD.r<DEF[B.d].r)return false}}
  return true}
function genMoves(s,sq,R,noCastle){
  const P=s.b[sq];if(!P)return[];const D=DEF[P.d],o=P.o,f=o===0?1:-1,x=sq&7,y=sq>>3;
  R=R||rules(s);
  if(frozen(s,sq,o))return[];
  const wrap=R.wrap[o],cap=R.storm[1-o]?3:8,grav=R.grav[1-o];const out=[],seen=new Set();
  const add=m=>{if(grav&&m.k!=='sh'&&((m.t>>3)-y)*f<0)return;const k=m.t+m.k;if(!seen.has(k)){seen.add(k);out.push(m)}};
  const step=(cx,cy,dx,dy)=>{let nx=cx+dx,ny=cy+dy;if(ny<0||ny>7)return-1;if(nx<0||nx>7){if(!wrap)return-1;nx=(nx+8)%8}return ny*8+nx};
  const can=(T,t,kind)=>T.o!==o&&capOK(s,P,T,t,R,kind);
  let specs=D.moves;
  if(D.T.mimic){specs=specs.slice();for(const n of nbrs(sq)){const Q=s.b[n];if(Q&&!DEF[Q.d].T.mimic)for(const M of DEF[Q.d].moves)if(M.ty!=='T'&&!(M.ty==='W'&&M.any))specs.push(M)}}
  for(const M of specs){
    if(M.first&&P.m)continue;
    const cm=M.mode.includes('m'),cc=M.mode.includes('c');
    if(M.ty==='L'){for(const[dx,dy]of M.o){const t=step(x,y,dx,dy*f);if(t<0||t===sq)continue;const T=s.b[t];if(!T){if(cm)add({f:sq,t,k:'mv'})}else if(cc&&can(T,t,'cp'))add({f:sq,t,k:'cp'})}}
    else if(M.ty==='R'){const n=Math.min(M.n,cap);for(const[dx,dy]of M.o){let cx=x,cy=y;for(let i=1;i<=n;i++){const t=step(cx,cy,dx,dy*f);if(t<0||t===sq)break;cx=t&7;cy=t>>3;const T=s.b[t];if(!T){if(cm)add({f:sq,t,k:'mv'});continue}if(cc&&can(T,t,'cp'))add({f:sq,t,k:'cp'});if(!M.pass)break}}}
    else if(M.ty==='C'){for(const[dx,dy]of M.o){let cx=x,cy=y,screen=false;for(let i=1;i<=8;i++){const t=step(cx,cy,dx,dy*f);if(t<0||t===sq)break;cx=t&7;cy=t>>3;const T=s.b[t];if(!screen){if(!T){if(i<=cap)add({f:sq,t,k:'mv'})}else screen=true}else if(T){if(can(T,t,'cp'))add({f:sq,t,k:'cp'});break}}}}
    else if(M.ty==='G'){for(const[dx,dy]of M.o){let cx=x,cy=y;for(let i=1;i<=8;i++){const t=step(cx,cy,dx,dy*f);if(t<0||t===sq)break;cx=t&7;cy=t>>3;if(s.b[t]){const t2=step(cx,cy,dx,dy*f);if(t2>=0&&t2!==sq){const T=s.b[t2];if(!T)add({f:sq,t:t2,k:'mv'});else if(can(T,t2,'cp'))add({f:sq,t:t2,k:'cp'})}break}}}}
    else if(M.ty==='S'){for(const[dx,dy]of M.o){let cx=x,cy=y;for(let i=1;i<=M.n;i++){const t=step(cx,cy,dx,dy*f);if(t<0||t===sq)break;cx=t&7;cy=t>>3;const T=s.b[t];if(T){if(can(T,t,'sh'))add({f:sq,t,k:'sh'});break}}}}
    else if(M.ty==='T'){for(let t=0;t<64;t++)if(!s.b[t])add({f:sq,t,k:'mv'})}
    else if(M.ty==='W'){const ts=M.any?[...Array(64).keys()]:M.o.map(([dx,dy])=>step(x,y,dx,dy*f));for(const t of ts){if(t<0||t===sq)continue;const Q=s.b[t];if(Q&&Q.o===o)add({f:sq,t,k:'sw'})}}
  }
  if(D.T.ep&&s.ep&&s.ep.o!==o){const ex=s.ep.sq&7,ey=s.ep.sq>>3;if(ey===y+f&&Math.abs(ex-x)===1&&!s.b[s.ep.sq]){const T=s.b[s.ep.pawn];if(T&&T.o!==o&&capOK(s,P,T,s.ep.pawn,R,'cp'))add({f:sq,t:s.ep.sq,k:'cp',ep:s.ep.pawn})}}
  if(!noCastle&&D.T.king&&D.T.castle&&!P.m){
    for(const d of[-1,1]){let cx=x+d;while(cx>=0&&cx<=7&&!s.b[y*8+cx])cx+=d;if(cx<0||cx>7)continue;
      const Q=s.b[y*8+cx];if(Q.o!==o||Q.m||!DEF[Q.d].T.castle||DEF[Q.d].T.king||Math.abs(cx-x)<3)continue;
      if(attacked(s,sq,1-o,R)||attacked(s,y*8+x+d,1-o,R)||attacked(s,y*8+x+2*d,1-o,R))continue;
      add({f:sq,t:y*8+x+2*d,k:'cs',rf:y*8+cx,rt:y*8+x+d});}
  }
  return out;
}
function attacked(s,sq,by,R){
  const orig=s.b[sq];if(!orig)s.b[sq]={d:'_d',o:1-by,m:1,sh:0,k:0,lv:0,h:null,u:-1};
  let hit=false;
  for(let i=0;i<64&&!hit;i++){const p=s.b[i];if(p&&p.o===by){for(const m of genMoves(s,i,R,true)){if(m.t===sq&&(m.k==='cp'||m.k==='sh')){hit=true;break}}}}
  s.b[sq]=orig;return hit;
}
function allMoves(s,o,noCastle){const R=rules(s),out=[];for(let i=0;i<64;i++){const p=s.b[i];if(p&&p.o===o)for(const m of genMoves(s,i,R,noCastle))out.push(m)}return out}
function kingSq(s,o){for(let i=0;i<64;i++){const p=s.b[i];if(p&&p.o===o&&isKing(p))return i}return-1}
function inCheck(s,o){const k=kingSq(s,o);return k>=0&&attacked(s,k,1-o,rules(s))}
function backEmpty(s,o){const y=o?7:0;for(const x of[4,3,5,2,6,1,7,0])if(!s.b[y*8+x])return y*8+x;return-1}

function applyMove(s,m,quiet){
  const P=s.b[m.f],o=P.o,D=DEF[P.d];s.ev=[];let capt=false,pawnish=!!(D.T.promote||D.T.ep),pos=m.t,txt='';
  s.ep=null;
  if(m.k==='mv'){s.b[m.t]=P;s.b[m.f]=null;P.m=1;
    if(D.T.ep&&(m.t&7)===(m.f&7)&&Math.abs((m.t>>3)-(m.f>>3))===2)s.ep={sq:(m.f+m.t)/2,pawn:m.t,o};
    if(!quiet)txt=`${D.n} ${sqn(m.f)}–${sqn(m.t)}`;}
  else if(m.k==='cs'){const Q=s.b[m.rf];s.b[m.t]=P;s.b[m.f]=null;s.b[m.rt]=Q;if(m.rf!==m.t&&m.rf!==m.rt)s.b[m.rf]=null;P.m=1;Q.m=1;if(!quiet)txt=`Rochade mit ${DEF[Q.d].n}`;}
  else if(m.k==='sw'){const Q=s.b[m.t];s.b[m.t]=P;s.b[m.f]=Q;P.m=1;Q.m=1;s.ev.push({t:'conv',sq:m.f});if(!quiet)txt=`${D.n} tauscht mit ${DEF[Q.d].n} (${sqn(m.f)}↔${sqn(m.t)})`;}
  else{const tsq=m.ep!=null?m.ep:m.t,T=s.b[tsq];capt=true;
    if(!quiet)txt=`${D.n} ${m.k==='sh'?'schießt auf':'schlägt'} ${DEF[T.d].n} ${sqn(tsq)}`;
    if(m.k==='sh')s.ev.push({t:'shot',f:m.f,to:tsq});
    pos=hit(s,P,m.f,tsq,m.k==='cp'?m.t:null);}
  const alive=pos>=0&&s.b[pos]===P;
  if(alive&&DEF[P.d].T.promote&&(pos>>3)===(o===0?7:0)){const to=rules(s).crown[o]?'amazone':(DEF[P.d].pt||'dame');P.d=to;s.ev.push({t:'promo',sq:pos,msg:`Beförderung zur ${DEF[to].n}`})}
  if(alive&&DEF[P.d].T.bless){let n=0;for(const q of nbrs(pos)){const Q=s.b[q];if(Q&&Q.o===o&&!Q.sh&&DEF[Q.d].r<=2){Q.sh=1;n++;s.ev.push({t:'shield',sq:q})}}if(n)s.ev.push({t:'x',msg:`Segen: ${n} Figur${n>1?'en':''} erhalten einen Schild`})}
  for(let i=0;i<64;i++){const Q=s.b[i];if(Q&&Q.o===o&&!Q.sh&&DEF[Q.d].T.regen){Q.rg=(Q.rg||0)+1;if(Q.rg>=3){Q.sh=1;Q.rg=0;s.ev.push({t:'shield',sq:i,msg:`Schild von ${DEF[Q.d].n} ist nachgewachsen`})}}}
  s.half=(capt||pawnish)?0:s.half+1;s.turn=1-o;s.ply++;
  const kc=[0,0];for(const p of s.b)if(p&&isKing(p))kc[p.o]++;
  for(const side of[0,1])if(!kc[side]){const hi=s.b.findIndex(p=>p&&p.o===side&&DEF[p.d].T.heir&&!p.kg);if(hi>=0){s.b[hi].kg=1;kc[side]=1;s.ev.push({t:'promo',sq:hi,msg:`${DEF[s.b[hi].d].n} besteigt den Thron`})}}
  if(!kc[0]||!kc[1])s.end=(!kc[0]&&!kc[1])?{w:'draw',why:'Beide Könige sind gefallen'}:{w:kc[0]?0:1,why:'König geschlagen'};
  if(!quiet){
    s.log.push({o,txt,ex:s.ev.filter(e=>e.msg).map(e=>e.msg)});
    if(!s.end){if(s.half>=100)s.end={w:'draw',why:'50 Züge ohne Schlagen'};else if(!allMoves(s,s.turn,false).length)s.end={w:'draw',why:'Patt: keine Züge möglich'}}
  }
}
function hit(s,A,aSq,tSq,moveTo){
  const T=s.b[tSq],AD=DEF[A.d],TD=DEF[T.d];
  if(T.sh){T.sh=0;T.rg=0;A.m=1;s.ev.push({t:'shield',sq:tSq,msg:`Schild von ${TD.n} zerbricht`});return aSq}
  if(AD.T.convert&&!isKing(T)){T.o=A.o;T.h=null;A.m=1;A.k++;s.ev.push({t:'conv',sq:tSq,msg:`${TD.n} wechselt die Seite`});evolve(s,A,aSq);return aSq}
  s.b[tSq]=null;let pos=aSq;
  if(moveTo!=null){s.b[aSq]=null;s.b[moveTo]=A;pos=moveTo}
  A.m=1;A.k++;
  kill(s,T,tSq,{A,pos});
  if(s.b[pos]===A){
    if(AD.T.drain&&!A.sh){A.sh=1;s.ev.push({t:'shield',sq:pos,msg:`${AD.n} trinkt Kraft: neuer Schild`})}
    if(AD.T.summon){const spot=!s.b[tSq]?tSq:(!s.b[aSq]?aSq:-1);if(spot>=0){const k=mk(s,'skelett',A.o,spot);k.m=1;s.b[spot]=k;s.ev.push({t:'reborn',sq:spot,msg:'Ein Skelett erhebt sich'})}}
    evolve(s,A,pos);}
  return pos;
}
function blast(s,n){const V=s.b[n];if(!V)return;if(V.sh){V.sh=0;V.rg=0;s.ev.push({t:'shield',sq:n});return}s.b[n]=null;kill(s,V,n,{})}
function kill(s,T,sq,ctx){
  const TD=DEF[T.d];s.ev.push({t:'die',sq});
  if(TD.T.explode){s.ev.push({t:'boom',sq,msg:`${TD.n} explodiert`});blast(s,sq);for(const n of nbrs(sq))blast(s,n)}
  if(TD.T.rache&&ctx.A&&s.b[ctx.pos]===ctx.A){s.ev.push({t:'boom',sq:ctx.pos,msg:`Rache: ${DEF[ctx.A.d].n} fällt mit`});const A=ctx.A;s.b[ctx.pos]=null;kill(s,A,ctx.pos,{})}
  if(TD.T.hydra){const sp=TD.spawn||{id:'bauer',n:2};let n=0;for(const i of nbrs(sq)){if(n>=sp.n)break;if(!s.b[i]){const b=mk(s,sp.id,T.o,i);b.m=1;s.b[i]=b;n++;s.ev.push({t:'reborn',sq:i})}}if(n)s.ev.push({t:'x',msg:`${TD.n} zerfällt: ${n}× ${DEF[sp.id].n}`})}
  let reborn=false;
  if(T.lv>0){const spot=(T.h!=null&&!s.b[T.h])?T.h:backEmpty(s,T.o);if(spot>=0){T.lv--;T.sh=TD.T.shield?1:0;T.rg=0;T.m=1;s.b[spot]=T;reborn=true;s.ev.push({t:'reborn',sq:spot,msg:`${TD.n} wird wiedergeboren`})}}
  if(!reborn)s.cap[T.o].push(T.d);
}
function evolve(s,A,pos){const D=DEF[A.d];if(D.evo&&A.k>=D.evo.n){A.d=D.evo.to;A.k=0;if(DEF[A.d].T.shield)A.sh=1;s.ev.push({t:'promo',sq:pos,msg:`${D.n} steigt auf zum ${DEF[A.d].n}`})}}

/* ---------- AI ---------- */
const TO={};
function pval(p){return DEF[p.d].v}
function evalFor(s,side){let sc=0;for(let i=0;i<64;i++){const p=s.b[i];if(!p)continue;const D=DEF[p.d];let v=D.v+(p.sh?0.3+D.v*0.15:0)+p.lv*D.v*0.6;
  const x=i&7,y=i>>3;if(D.T.promote)v+=(p.o===0?y:7-y)*0.08;if(!D.T.king)v+=((3.5-Math.abs(3.5-x))+(3.5-Math.abs(3.5-y)))*0.025;sc+=p.o===side?v:-v}return sc}
function order(s,ms){return ms.map(m=>{let sc=0;if(m.k==='cp'||m.k==='sh'){const T=s.b[m.ep!=null?m.ep:m.t];sc=100+(T?pval(T)*10:0)-pval(s.b[m.f])}return[sc,m]}).sort((a,b)=>b[0]-a[0]).map(a=>a[1])}
function nm(s,depth,a,b,dl){
  if(s.end){if(s.end.w==='draw')return 0;return(s.end.w===s.turn?1:-1)*(1000+depth)}
  if(depth===0)return evalFor(s,s.turn);
  if(dl!==Infinity&&performance.now()>dl)throw TO;
  const ms=order(s,allMoves(s,s.turn,true));if(!ms.length)return 0;
  let best=-Infinity;for(const m of ms){const c=clone(s);applyMove(c,m,true);const v=-nm(c,depth-1,-b,-a,dl);if(v>best)best=v;if(best>a)a=best;if(a>=b)break}
  return best;
}
function pickAI(s,lvl){
  const ms=order(s,allMoves(s,s.turn,false));if(!ms.length)return null;
  for(const m of ms){if(m.k!=='cp'&&m.k!=='sh')continue;const c=clone(s);applyMove(c,m,true);if(c.end&&c.end.w===s.turn)return m}
  const root=(d,dl)=>ms.map(m=>{const c=clone(s);applyMove(c,m,true);return[m,-nm(c,d-1,-Infinity,Infinity,dl)]});
  let sc=root(2,Infinity);
  if(lvl==='normal'){try{sc=root(3,performance.now()+1800)}catch(e){if(e!==TO)throw e}}
  const noise=lvl==='leicht'?1.6:0.15;let best=null,bv=-Infinity;
  for(const[m,v]of sc){const w=v+Math.random()*noise;if(w>bv){bv=w;best=m}}
  return best;
}

const KEY='chessrng-v1', CAP=360, TICK=10000;
function fresh(){return{v:1,coll:{bauer:8,turm:2,springer:2,laeufer:2,dame:1,koenig:1},seen:{bauer:1,turm:1,springer:1,laeufer:1,dame:1,koenig:1},

  const f=fresh();if(!o||o.v!==1)return f;
  const S=Object.assign(f,o);S.opt=Object.assign(fresh().opt,o.opt||{});S.opt.dev=false;S.setup=Object.assign(fresh().setup,o.setup||{});

  if(S.game){try{if(!S.game.s||S.game.s.b.some(p=>p&&!DEF[p.d]))S.game=null}catch(e){S.game=null}}

/* ================= CANOPY ================= */
// Canopy Base (canopybase.pages.dev): Läuft das Spiel dort im Player, wird der Spielstand zusätzlich in der
// Canopy ID gespeichert (2 s nach jeder Änderung, zusätzlich alle 30 s und beim Verlassen). Direkt auf chessrng.web.app ändert sich nichts,
// außer dem Button "In Canopy ID übertragen" in den Einstellungen. Lokal gespeichert wird immer wie bisher.
//
// Abgleich NICHT nach Uhrzeit, sondern nach Cloud-Version: Lokal wird gemerkt, welche Cloud-Version dieser
// Stand zuletzt hatte (SYNC_KEY). Ist die Cloud neuer (anderes Gerät, neu übertragen), gewinnt die Cloud.
// Bevor ein lokaler Stand ersetzt wird, wird er unter KEY+'-backup-<zeit>' gesichert.
const CANOPY_URL='https://canopybase.pages.dev', CANOPY_GAME='chess-rng', PID_KEY='chessrng-player', SYNC_KEY='chessrng-canopy-sync';
const CAN=()=>(window.Canopy&&window.Canopy.inHub)?window.Canopy:null;
let canopyDirty=false, canopyOn=false;
var canopyReloading=false, canopySoonT=0, canopyBusy=false; // var: wird in save() schon vor dieser Zeile gelesen
// 2 s nach der letzten Änderung hochladen. Nur beim Schließen zu speichern reicht nicht: der Browser bricht das ab.
function canopySoon(){if(!CAN()||canopySoonT)return;canopySoonT=setTimeout(()=>{canopySoonT=0;canopyPush()},2000)} // höchstens alle 2 s
function canopyPayload(){let pid=null;try{pid=localStorage.getItem(PID_KEY)}catch(e){}return{state:S,playerId:pid}}
function syncedVersion(){try{const o=JSON.parse(localStorage.getItem(SYNC_KEY)||'null');return o&&typeof o.v==='number'?o.v:null}catch(e){return null}}
function setSynced(v){try{localStorage.setItem(SYNC_KEY,JSON.stringify({v:v,at:Date.now()}))}catch(e){}}
function canopyApply(d,version){ // Cloud-Stand übernehmen (lokalen vorher sichern) und neu laden
  clearTimeout(saveT);canopyOn=false;canopyReloading=true;
  try{const old=localStorage.getItem(KEY);if(old)localStorage.setItem(KEY+'-backup-'+Date.now(),old);
    localStorage.setItem(KEY,JSON.stringify(d.state));if(d.playerId)localStorage.setItem(PID_KEY,d.playerId);setSynced(version)}catch(e){return}
  location.reload()}
function canopyPush(){const C=CAN();if(!C||!canopyOn||!canopyDirty)return;
  if(canopyBusy)return; // läuft schon ein Upload, geht der nächste danach los
  canopyDirty=false;canopyBusy=true;
  C.save(canopyPayload()).then(r=>{
    if(r&&r.ok)setSynced(r.version);
    else if(r&&r.conflict&&r.data&&r.data.state)canopyApply(r.data,r.version); // woanders neuer gespeichert: Cloud gewinnt
  }).catch(()=>{canopyDirty=true}).finally(()=>{canopyBusy=false;if(canopyDirty)canopySoon()})}
(function canopyBoot(){const C=CAN();if(!C)return;C.ready(CANOPY_GAME);
  C.load().then(({data,version})=>{
    const cloud=data&&data.state, mine=syncedVersion();
    if(cloud&&(mine===null||version>mine)){canopyApply(data,version);return} // Cloud ist neuer oder dieser Stand war nie abgeglichen
    canopyOn=true;
    if(!cloud||version===mine){canopyDirty=true;canopyPush()}
    else C.save(canopyPayload(),{force:true}).then(r=>{if(r&&r.ok)setSynced(r.version)}).catch(()=>{}); // Cloud wurde zurückgesetzt
  }).catch(()=>{});
  setInterval(canopyPush,30000);
  document.addEventListener('visibilitychange',()=>{if(document.hidden)canopyPush()});
  addEventListener('pagehide',canopyPush);
})();
function canopyTransfer(){ // von chessrng.web.app aus: Spielstand in die Canopy ID kopieren
  const w=window.open(CANOPY_URL+'/transfer.html?g='+CANOPY_GAME,'canopy-transfer','width=480,height=680');
  if(!w){toast('Bitte Pop-ups für diese Seite erlauben.');return}
  const onMsg=e=>{if(e.origin!==CANOPY_URL||e.source!==w)return;const m=e.data;if(!m||m.canopy!==1)return;
    if(m.type==='transfer-ready'){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(err){}w.postMessage({canopy:1,type:'transfer-data',data:JSON.stringify(canopyPayload())},CANOPY_URL)}
    if(m.type==='transfer-done'){toast('Spielstand ist jetzt in deiner Canopy ID.');removeEventListener('message',onMsg)}};
  addEventListener('message',onMsg)}

function updateRollBtns(){const a=$('#bRoll'),b=$('#bRoll10');if(!a)return;a.disabled=UI.rolling||S.rolls<1;b.disabled=UI.rolling||S.rolls<1;const c=$('#bRoll100');if(c){c.disabled=UI.rolling||S.rolls<1;c.textContent=`${Math.max(1,Math.min(100,S.rolls))}× würfeln`}

function pickPiece(){let t=0;for(let i=RAR.length-1;i>=1;i--)if(Math.random()<1/RAR[i].odds){t=i;break}
  const L=BYR[t];let x=Math.random()*L.reduce((a,D)=>a+D.w,0);for(const D of L){x-=D.w;if(x<=0)return D}return L[L.length-1]}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function doRoll(n,free){
  if(UI.rolling)return;const k=free?n:Math.min(n,S.rolls);if(k<1){toast('Kein Wurf übrig. Der nächste kommt in ein paar Sekunden.');return}

  const res=[];for(let i=0;i<k;i++)res.push(rollOnce(free));save();tick();

function bestLoadout(){const own=[];for(const id in S.coll)for(let i=0;i<S.coll[id];i++)own.push(DEF[id]);
  const kings=own.filter(D=>D.T.king).sort((a,b)=>b.r-a.r||b.v-a.v);if(!kings.length)return null;
  const rest=own.filter(D=>!D.T.king).sort((a,b)=>b.v-a.v).slice(0,15);
  const pawns=rest.filter(D=>D.T.promote),big=rest.filter(D=>!D.T.promote);
  const slots=Array(16).fill(null);slots[4]=kings[0].id;const back=[3,5,2,6,1,7,0];const front=[11,12,10,13,9,14,8,15];
  const castles=big.filter(D=>D.T.castle&&kings[0].T.castle);
  for(const D of big){let spot=back.find(i=>!slots[i]);if(spot==null)spot=front.find(i=>!slots[i]);if(spot!=null)slots[spot]=D.id}
  // Rochade-Partner an den Rand
  if(castles.length){for(const edge of[0,7]){const idx=slots.findIndex((id,i)=>i<8&&i!==edge&&id&&DEF[id].T.castle&&i!==0&&i!==7);if(idx>=0&&!(slots[edge]&&DEF[slots[edge]].T.castle))[slots[edge],slots[idx]]=[slots[idx],slots[edge]]}}
  for(const D of pawns){let spot=front.find(i=>!slots[i]);if(spot==null)spot=back.find(i=>!slots[i]);if(spot!=null)slots[spot]=D.id}
  return slots}

  return slots}

  n.leaderboard(50).then(list=>{const L=$('#rankList');if(!L)return;
    if(!list.length){L.innerHTML='<p class="note">Noch keine Einträge. Gewinne eine Online-Partie, um der Erste zu sein.</p>'}
    else L.innerHTML=`<div class="rtable"><table><thead><tr><th>#</th><th>Name</th><th>Siege</th><th>Niederl.</th><th>Remis</th><th>Quote</th></tr></thead><tbody>${list.map((p,i)=>`<tr class="${p.id===n.playerId?'me':''}"><td class="mono">${i+1}</td><td>${esc(p.name||'Gast')}${p.id===n.playerId?' <span class="chip">Du</span>':''}</td><td class="mono">${p.wins||0}</td><td class="mono">${p.losses||0}</td><td class="mono">${p.draws||0}</td><td class="mono">${p.games?Math.round(100*(p.wins||0)/p.games)+' %':'–'}</td></tr>`).join('')}</tbody></table></div>`;
    const me=list.find(p=>p.id===n.playerId);return me?me:n.myStats()}).then(me=>{const M=$('#rankMe');if(!M)return;
    M.innerHTML=me&&me.games?`<div class="stats"><div class="stat"><b>${me.wins||0}</b><span>Siege</span></div><div class="stat"><b>${me.losses||0}</b><span>Niederlagen</span></div><div class="stat"><b>${me.draws||0}</b><span>Remis</span></div><div class="stat"><b>${me.games}</b><span>Partien</span></div></div>`:'<p class="note">Du hast noch keine Online-Partie beendet.</p>'})
  .catch(e=>{const L=$('#rankList');if(L)L.innerHTML=`<p class="warn">Rangliste konnte nicht geladen werden: ${esc(e.code||e.message)}</p>`})}
function leaveGame(){maybeRecord();if(GR.unsub){GR.unsub();GR.unsub=null}clearInterval(GR.ping);GR.watching=null;GR.oppGone=false;GR.netErr='';S.game=null;save();renderPlay()}
window.CRNG_netReady=()=>{if(S.tab==='play')renderPlay()};
window.addEventListener('beforeunload',()=>{if(UI.q&&UI.q.cancel)try{UI.q.cancel()}catch(e){}});

/* ================= BOOT ================= */
tick();setInterval(tick,250);setTab(S.tab||'roll');
</script>

<script type="module">
// ===== Chess RNG: Online-Warteschlange über Firebase (ohne Anmeldung) =====
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAnalytics, isSupported } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, onSnapshot, query, where, limit, orderBy, runTransaction, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBjnQR5gkQyPgbiKDF4QLB-r0cXp2Rdwtg",
  authDomain: "chessrngreal.firebaseapp.com",
  projectId: "chessrngreal",
  storageBucket: "chessrngreal.firebasestorage.app",
  messagingSenderId: "236076929949",
  appId: "1:236076929949:web:61f8ece50bc2f42774d574",
  measurementId: "G-KS4VQNSM20"
};
const app = initializeApp(firebaseConfig);
isSupported().then(ok => { if (ok) getAnalytics(app); }).catch(() => {});
const db = getFirestore(app);

// Zufällige Spieler-ID pro Browser statt Anmeldung
// Pro Tab eigene ID (sessionStorage), damit auch zwei Tabs im selben Browser gegeneinander spielen können
let pid = null;
try { pid = sessionStorage.getItem("chessrng-pid"); } catch (e) {}
if (!pid) { pid = "p" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); try { sessionStorage.setItem("chessrng-pid", pid); } catch (e) {} }

// Dauerhafte Spieler-ID für die Rangliste (pro Browser)
let playerId = null;
try { playerId = localStorage.getItem("chessrng-player"); } catch (e) {}
if (!playerId) { playerId = "u" + Math.random().toString(36).slice(2, 10) + Date.now().toString(36); try { localStorage.setItem("chessrng-player", playerId); } catch (e) {} }

const STALE = 120000;  // Wartende ohne Lebenszeichen seit 2 min werden ignoriert (großzügig wegen abweichender Uhren)

const NET = {
  pid, playerId,

  search({ name, load }, cb) {
    const myRef = doc(db, "queue", pid);
    let done = false, unsub = null, hb = null, retry = null, inQueue = false;
    const stop = () => { done = true; if (unsub) unsub(); clearInterval(hb); clearInterval(retry); };
    const finish = (id, me) => { if (done) return; stop(); cb({ type: "match", id, me }); };

    // Versucht, einen anderen Wartenden zu schnappen und die Partie anzulegen
    const tryMatch = async () => {
      const snap = await getDocs(query(collection(db, "queue"), where("room", "==", null), limit(25)));
      const cands = snap.docs.map(d => d.data())
        .filter(o => o.pid !== pid && Date.now() - o.ts < STALE)
        .sort((a, b) => a.ts - b.ts);
      for (const o of cands) {
        if (done) return true;
        try {
          const res = await runTransaction(db, async tx => {
            const oRef = doc(db, "queue", o.pid);
            const cur = await tx.get(oRef);
            if (!cur.exists() || cur.data().room) throw new Error("vergeben");
            if (inQueue) { const mine = await tx.get(myRef); if (mine.exists() && mine.data().room) throw new Error("selbst gematcht"); }
            const other = cur.data();
            const gRef = doc(collection(db, "games"));
            const meWhite = Math.random() < 0.5;
            const mine = { pid, name, load, player: playerId };
            const W = meWhite ? mine : other, B = meWhite ? other : mine;
            const s = window.buildState(W.load, B.load);
            const now = Date.now();
            tx.set(gRef, { w: W.pid, b: B.pid, wP: W.player || W.pid, bP: B.player || B.pid, winner: null, wName: W.name, bName: B.name, state: JSON.stringify(s), ev: "[]",
              ply: 0, lastF: -1, lastT: -1, status: "playing", seenW: now, seenB: now, created: serverTimestamp() });
            tx.update(oRef, { room: gRef.id });
            if (inQueue) tx.delete(myRef);
            return { id: gRef.id, me: meWhite ? 0 : 1 };
          });
          finish(res.id, res.me);
          return true;
        } catch (e) { /* nächsten Kandidaten versuchen */ }
      }
      return false;
    };

    let step = "";
    (async () => {
      try {
        step = "Warteschlange lesen";
        if (await tryMatch()) return;
        if (done) return;
        step = "alten Eintrag entfernen";
        await deleteDoc(myRef).catch(() => {});
        step = "in Warteschlange eintragen";
        await setDoc(myRef, { pid, player: playerId, name, load, ts: Date.now(), room: null });
        step = "Warteschlange beobachten";
        inQueue = true;
        unsub = onSnapshot(myRef, async snap => {
          if (done) return;
          const d = snap.data();
          if (d && d.room && !done) {
            const gid = d.room;
            stop();
            deleteDoc(myRef).catch(() => {});
            const g = await getDoc(doc(db, "games", gid));
            if (g.exists()) cb({ type: "match", id: gid, me: g.data().w === pid ? 0 : 1 });
            else cb({ type: "error", msg: "Partie nicht gefunden" });
          }
        }, e => { console.warn("Chess RNG Online-Fehler bei: Warteschlange beobachten", e); if (!done) { stop(); cb({ type: "error", msg: "Warteschlange beobachten: " + (e.code || e.message) }); } });
        hb = setInterval(() => { if (!done) updateDoc(myRef, { ts: Date.now() }).catch(() => {}); }, 15000);
        retry = setInterval(() => { if (!done) tryMatch().catch(() => {}); }, 7000);
      } catch (e) { console.warn("Chess RNG Online-Fehler bei:", step, e); if (!done) { stop(); cb({ type: "error", msg: step + ": " + (e.code || e.message) }); } }
    })();

    return () => { if (done) return; stop(); if (inQueue) deleteDoc(myRef).catch(() => {}); };
  },

  async getGame(id) { const s = await getDoc(doc(db, "games", id)); return s.exists() ? s.data() : null; },

  watchGame(id, cb) {
    return onSnapshot(doc(db, "games", id), s => cb(s.exists() ? s.data() : null), e => { console.warn(e); cb(undefined, e); });
  },

  async sendMove(id, { state, ev, prevPly, ply, lastF, lastT, status, winner }) {
    const ref = doc(db, "games", id);
    await runTransaction(db, async tx => {
      const s = await tx.get(ref);
      const d = s.data();
      if (!d || d.ply !== prevPly) throw new Error("Stand passt nicht zum Server");
      tx.update(ref, { state, ev, ply, lastF, lastT, status, winner: winner || null });
    });
  },

  // ----- Rangliste -----
  async recordResult(gameId, outcome, name) {
    const pRef = doc(db, "players", playerId), rRef = doc(db, "results", gameId + "_" + playerId);
    await runTransaction(db, async tx => {
      const r = await tx.get(rRef);
      if (r.exists()) return;                       // schon gezählt
      const p = await tx.get(pRef);
      const d = p.exists() ? p.data() : { wins: 0, losses: 0, draws: 0, games: 0 };
      tx.set(rRef, { game: gameId, player: playerId, outcome, ts: Date.now() });
      tx.set(pRef, {
        name: (name || "Gast").slice(0, 20),
        wins: (d.wins || 0) + (outcome === "win" ? 1 : 0),
        losses: (d.losses || 0) + (outcome === "loss" ? 1 : 0),
        draws: (d.draws || 0) + (outcome === "draw" ? 1 : 0),
        games: (d.games || 0) + 1,
        lastGame: gameId, updated: Date.now()
      });
    });
  },

  async leaderboard(n) {
    const s = await getDocs(query(collection(db, "players"), orderBy("wins", "desc"), limit(n)));
    return s.docs.map(d => ({ id: d.id, ...d.data() }));
  },

  async myStats() { const s = await getDoc(doc(db, "players", playerId)); return s.exists() ? s.data() : null; },

  async setName(name) {
    const ref = doc(db, "players", playerId);
    const s = await getDoc(ref);
    if (s.exists()) await updateDoc(ref, { name: name.slice(0, 20), updated: Date.now() });
  },

  ping(id, me) { updateDoc(doc(db, "games", id), me === 0 ? { seenW: Date.now() } : { seenB: Date.now() }).catch(() => {}); }
};

window.CRNG_NET = NET;
window.CRNG_netReady && window.CRNG_netReady();
</script>
